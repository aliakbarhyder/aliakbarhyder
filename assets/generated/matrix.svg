
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="150"
  viewBox="0 0 1000 150"
  role="img"
  aria-label="Animated Matrix text"
>
  <defs>

    <filter id="glow">
      <feGaussianBlur
        stdDeviation="3"
        result="coloredBlur"
      />

      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#05080a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

  </defs>

  <rect
    width="100%"
    height="100%"
    rx="18"
    fill="url(#background)"
  />

  <g
    font-family="JetBrains Mono, SFMono-Regular, Consolas, monospace"
    font-size="34"
    font-weight="700"
    fill="#00ff66"
    filter="url(#glow)"
  >
    
    <text
      x="50%"
      y="50%"
      text-anchor="middle"
      dominant-baseline="middle"
      class="message message-0"
    >
      ALI AKBAR HYDER
    </text>
  
    <text
      x="50%"
      y="50%"
      text-anchor="middle"
      dominant-baseline="middle"
      class="message message-1"
    >
      BUILDING WHAT'S NEXT
    </text>
  
    <text
      x="50%"
      y="50%"
      text-anchor="middle"
      dominant-baseline="middle"
      class="message message-2"
    >
      EXPERIMENT • BUILD • IMPROVE
    </text>
  
  </g>

  <style>

    .message {
      opacity: 0;
      animation: cycle 15s infinite;
    }

    .message-0 {
      animation-delay: 0s;
    }

    .message-1 {
      animation-delay: 5s;
    }

    .message-2 {
      animation-delay: 10s;
    }

    @keyframes cycle {

      0% {
        opacity: 0;
        transform: translateY(12px);
      }

      8% {
        opacity: 1;
        transform: translateY(0);
      }

      28% {
        opacity: 1;
      }

      33% {
        opacity: 0;
        transform: translateY(-10px);
      }

      100% {
        opacity: 0;
      }

    }

  </style>

</svg>
