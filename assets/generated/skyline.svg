
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="180"
  viewBox="0 0 1000 180"
>
  <defs>

    <linearGradient
      id="sky"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#062b3d"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <rect
    width="100%"
    height="100%"
    rx="20"
    fill="url(#sky)"
  />

  <g
    fill="#00d9ff"
    opacity="0.9"
  >

    <rect x="80" y="95" width="45" height="85"/>
    <rect x="140" y="65" width="55" height="115"/>
    <rect x="215" y="110" width="40" height="70"/>
    <rect x="275" y="40" width="70" height="140"/>
    <rect x="370" y="80" width="55" height="100"/>
    <rect x="450" y="55" width="80" height="125"/>
    <rect x="560" y="100" width="50" height="80"/>
    <rect x="635" y="45" width="75" height="135"/>
    <rect x="735" y="85" width="55" height="95"/>
    <rect x="815" y="60" width="70" height="120"/>

  </g>

  <text
    x="50%"
    y="82"
    text-anchor="middle"
    fill="#ffffff"
    font-family="JetBrains Mono, monospace"
    font-size="38"
    font-weight="700"
    filter="url(#glow)"
  >
    SKYLINE
  </text>

  <text
    x="50%"
    y="115"
    text-anchor="middle"
    fill="#8b949e"
    font-family="JetBrains Mono, monospace"
    font-size="16"
  >
    WEATHER • DATA • WEB
  </text>

  <style>

    rect {
      animation: skyline 4s ease-in-out infinite alternate;
    }

    rect:nth-child(2n) {
      animation-delay: 0.7s;
    }

    rect:nth-child(3n) {
      animation-delay: 1.2s;
    }

    @keyframes skyline {

      from {
        opacity: 0.35;
      }

      to {
        opacity: 0.9;
      }

    }

  </style>

</svg>
