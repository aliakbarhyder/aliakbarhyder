<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="300"
  viewBox="0 0 1000 300"
  role="img"
  aria-label="Live system status"
>
  <defs>

    <linearGradient
      id="statusBackground"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#030604"/>
      <stop offset="100%" stop-color="#08120b"/>
    </linearGradient>

    <linearGradient
      id="progressGradient"
      x1="0"
      y1="0"
      x2="1"
      y2="0"
    >
      <stop offset="0%" stop-color="#007c32"/>
      <stop offset="55%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#8cffae"/>
    </linearGradient>

    <filter id="statusGlow">
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <rect
    width="1000"
    height="300"
    rx="24"
    fill="url(#statusBackground)"
    stroke="#00ff6640"
  />

  <circle
    cx="72"
    cy="72"
    r="7"
    fill="#00ff66"
    filter="url(#statusGlow)"
  >
    <animate
      attributeName="opacity"
      values="0.35;1;0.35"
      dur="1.6s"
      repeatCount="indefinite"
    />
  </circle>

  <text
    x="94"
    y="78"
    font-family="monospace"
    font-size="16"
    letter-spacing="3"
    fill="#74ff9d"
  >
    LIVE SYSTEM STATUS
  </text>

  <text
    x="928"
    y="78"
    text-anchor="end"
    font-family="monospace"
    font-size="13"
    letter-spacing="2"
    fill="#00ff66"
    opacity="0.7"
  >
    AUTO-UPDATING
  </text>

  <text
    x="120"
    y="145"
    font-family="monospace"
    font-size="34"
    font-weight="700"
    letter-spacing="4"
    fill="#00ff66"
    filter="url(#statusGlow)"
  >
    ARCHITECTING
  </text>

  <text
    x="122"
    y="180"
    font-family="monospace"
    font-size="16"
    fill="#8fbf9e"
  >
    designing systems before they design themselves...
  </text>

  <rect
    x="120"
    y="215"
    width="760"
    height="16"
    rx="8"
    fill="#00ff6614"
    stroke="#00ff6638"
  />

  <rect
    x="120"
    y="215"
    width="0"
    height="16"
    rx="8"
    fill="url(#progressGradient)"
    filter="url(#statusGlow)"
  >
    <animate
      attributeName="width"
      from="0"
      to="691.6"
      dur="8s"
      fill="freeze"
    />
  </rect>

  <text
    x="900"
    y="265"
    text-anchor="end"
    font-family="monospace"
    font-size="13"
    fill="#00ff66"
    opacity="0.7"
  >
    91% COMPLETE
  </text>

  <text
    x="120"
    y="265"
    font-family="monospace"
    font-size="13"
    letter-spacing="2"
    fill="#5b966d"
  >
    NEXT → ENCRYPTING
  </text>

</svg>