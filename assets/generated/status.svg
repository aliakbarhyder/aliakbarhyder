<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  viewBox="0 0 1100 320"
  role="img"
  aria-label="Animated development status"
>
  <defs>
    <style>
      @keyframes statusCycle {
        0% {
          opacity: 0;
          transform: translateY(8px);
        }

        2% {
          opacity: 1;
          transform: translateY(0);
        }

        11% {
          opacity: 1;
        }

        12.5% {
          opacity: 0;
          transform: translateY(-8px);
        }

        100% {
          opacity: 0;
        }
      }

      @keyframes progressFill {
        0% {
          transform: scaleX(0.02);
        }

        100% {
          transform: scaleX(1);
        }
      }

      .indicator {
        animation: indicatorPulse 1.2s ease-in-out infinite;
      }

      @keyframes indicatorPulse {
        0%, 100% {
          opacity: 0.4;
        }

        50% {
          opacity: 1;
        }
      }
    </style>
  </defs>

  <rect
    width="1100"
    height="320"
    rx="20"
    fill="#050906"
    stroke="#183522"
    stroke-width="2"
  />

  <text
    x="80"
    y="70"
    fill="#d5ffe2"
    font-family="monospace"
    font-size="22"
    font-weight="700"
    letter-spacing="2"
  >
    LIVE SYSTEM STATUS
  </text>

  <text
    x="80"
    y="100"
    fill="#5f7869"
    font-family="monospace"
    font-size="12"
    letter-spacing="2"
  >
    CURRENT DEVELOPMENT PROCESS
  </text>

  <circle
    cx="1010"
    cy="75"
    r="7"
    fill="#00ff7b"
    class="indicator"
  />

  <text
    x="990"
    y="79"
    text-anchor="end"
    fill="#6c8a77"
    font-family="monospace"
    font-size="11"
  >
    LIVE
  </text>

  
    <g
