<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1000"
  height="360"
  viewBox="0 0 1000 360"
  role="img"
  aria-label="Rotating developer terminal"
>
  <defs>

    <linearGradient
      id="terminalBackground"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#020403"/>
      <stop offset="100%" stop-color="#09100b"/>
    </linearGradient>

  </defs>

  <rect
    width="1000"
    height="360"
    rx="24"
    fill="url(#terminalBackground)"
    stroke="#00ff6640"
  />

  <rect
    x="0"
    y="0"
    width="1000"
    height="52"
    rx="24"
    fill="#0b140e"
  />

  <circle
    cx="48"
    cy="26"
    r="7"
    fill="#00ff66"
    opacity="0.8"
  />

  <circle
    cx="72"
    cy="26"
    r="7"
    fill="#00b84d"
    opacity="0.55"
  />

  <circle
    cx="96"
    cy="26"
    r="7"
    fill="#176f37"
    opacity="0.45"
  />

  <text
    x="500"
    y="32"
    text-anchor="middle"
    font-family="monospace"
    font-size="14"
    letter-spacing="3"
    fill="#7effa3"
    opacity="0.7"
  >
    ALI@SYSTEM:~
  </text>

  
        <text
          x="70"
          y="80"
          font-family="monospace"
          font-size="18"
          fill="#9cffbd"
          opacity="0"
        >
          $ system status

          <animate
            attributeName="opacity"
            values="0;1;1;1;0"
            keyTimes="0;0.08;0.82;0.95;1"
            dur="60s"
            begin="0s"
            repeatCount="indefinite"
          />
        </text>
      
        <text
          x="70"
          y="118"
          font-family="monospace"
          font-size="18"
          fill="#b9c7bd"
          opacity="0"
        >
          ◉ ARCHITECTING

          <animate
            attributeName="opacity"
            values="0;1;1;1;0"
            keyTimes="0;0.08;0.82;0.95;1"
            dur="60s"
            begin="0.6s"
            repeatCount="indefinite"
          />
        </text>
      
        <text
          x="70"
          y="156"
          font-family="monospace"
          font-size="18"
          fill="#b9c7bd"
          opacity="0"
        >
          91% PROCESS COMPLETE

          <animate
            attributeName="opacity"
            values="0;1;1;1;0"
            keyTimes="0;0.08;0.82;0.95;1"
            dur="60s"
            begin="1.2s"
            repeatCount="indefinite"
          />
        </text>
      
        <text
          x="70"
          y="194"
          font-family="monospace"
          font-size="18"
          fill="#b9c7bd"
          opacity="0"
        >
          designing systems before they design themselves...

          <animate
            attributeName="opacity"
            values="0;1;1;1;0"
            keyTimes="0;0.08;0.82;0.95;1"
            dur="60s"
            begin="1.7999999999999998s"
            repeatCount="indefinite"
          />
        </text>
      
        <text
          x="70"
          y="232"
          font-family="monospace"
          font-size="18"
          fill="#00ff66"
          opacity="0"
        >
          ● awaiting next operation...

          <animate
            attributeName="opacity"
            values="0;1;1;1;0"
            keyTimes="0;0.08;0.82;0.95;1"
            dur="60s"
            begin="2.4s"
            repeatCount="indefinite"
          />
        </text>
      

  <text
    x="70"
    y="315"
    font-family="monospace"
    font-size="16"
    fill="#00ff66"
  >
    _
    <animate
      attributeName="opacity"
      values="0;1;1;0"
      dur="1s"
      repeatCount="indefinite"
    />
  </text>

  <text
    x="930"
    y="325"
    text-anchor="end"
    font-family="monospace"
    font-size="12"
    fill="#4f7659"
  >
    SECTION 2/4
  </text>

</svg>