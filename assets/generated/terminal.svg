              </text>
            
              <text
                x="60"
                y="122"
                class="normal"
              >
                [INFO] Scanning architecture...
              </text>
            
              <text
                x="60"
                y="164"
                class="normal"
              >
                [INFO] Evaluating implementation...
              </text>
            
              <text
                x="60"
                y="206"
                class="normal"
              >
                [INFO] Identifying improvements...
              </text>
            
              <text
                x="60"
                y="248"
                class="success"
              >
                [OK] Analysis complete.
              </text>
            
              <text
                x="60"
                y="290"
                class="normal"
              >
                
              </text>
            
              <text
                x="60"
                y="332"
                class="command"
              >
                $ _
              </text>
            
      </g>
    
      <g class="sequence sequence-2">
        
