<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  viewBox="0 0 1100 620"
  role="img"
  aria-label="Animated profile terminal"
>
  <defs>
    <linearGradient id="terminalBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060907"/>
      <stop offset="100%" stop-color="#0b120d"/>
    </linearGradient>

    <filter id="terminalGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .line {
        opacity: 0;
        animation: reveal 0.45s forwards;
      }

      .cursor {
        animation: blink 0.9s steps(2, start) infinite;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(5px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .pulse {
        animation: pulse 2.5s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.65;
        }

        50% {
          opacity: 1;
        }
      }
    </style>
  </defs>

  <rect
    x="0"
    y="0"
    width="1100"
    height="620"
    rx="20"
    fill="url(#terminalBackground)"
    stroke="#1c3425"
    stroke-width="2"
  />

  <rect
    x="0"
    y="0"
    width="1100"
    height="52"
    rx="20"
    fill="#0d1510"
  />

  <rect
    x="0"
    y="32"
    width="1100"
    height="20"
    fill="#0d1510"
  />

  <circle cx="32" cy="26" r="7" fill="#ff5f56"/>
  <circle cx="56" cy="26" r="7" fill="#ffbd2e"/>
  <circle cx="80" cy="26" r="7" fill="#27c93f"/>

  <text
    x="550"
    y="31"
    text-anchor="middle"
    fill="#6d8374"
    font-family="monospace"
    font-size="13"
  >
    profile@github:~
  </text>

  <g
    font-family="monospace"
    font-size="17"
  >

    <text
      x="40"
      y="95"
      fill="#00ff7b"
      class="line"
      style="animation-delay:0.3s"
    >
      $ whoami
    </text>

    <text
      x="40"
      y="130"
      fill="#d2ffe1"
      class="line"
      style="animation-delay:0.8s"
    >
      developer · builder · curious mind
    </text>

    <text
      x="40"
      y="185"
      fill="#00ff7b"
      class="line"
      style="animation-delay:1.4s"
    >
      $ profile --initialize
    </text>

    <text
      x="40"
      y="220"
      fill="#7fe8a8"
      class="line"
      style="animation-delay:1.9s"
    >
      ✔ Loading development environment
    </text>

    <text
      x="40"
      y="250"
      fill="#7fe8a8"
      class="line"
      style="animation-delay:2.3s"
    >
      ✔ Synchronizing GitHub activity
    </text>

    <text
      x="40"
      y="280"
      fill="#7fe8a8"
      class="line"
      style="animation-delay:2.7s"
    >
      ✔ Initializing project systems
    </text>

    <text
      x="40"
      y="310"
      fill="#7fe8a8"
      class="line"
      style="animation-delay:3.1s"
    >
      ✔ Establishing secure terminal connection
    </text>

    <text
      x="40"
      y="365"
      fill="#00ff7b"
      class="line"
      style="animation-delay:3.8s"
    >
      $ status --all
    </text>

    <text
      x="40"
      y="400"
      fill="#9ab5a4"
      class="line"
      style="animation-delay:4.3s"
    >
      environment:
    </text>

    <text
      x="200"
      y="400"
      fill="#00ff7b"
      class="line"
      style="animation-delay:4.6s"
    >
      ONLINE
    </text>

    <text
      x="40"
      y="430"
      fill="#9ab5a4"
      class="line"
      style="animation-delay:4.9s"
    >
      activity:
    </text>

    <text
      x="200"
      y="430"
      fill="#00ff7b"
      class="line"
      style="animation-delay:5.2s"
    >
      MONITORING
    </text>

    <text
      x="40"
      y="460"
      fill="#9ab5a4"
      class="line"
      style="animation-delay:5.5s"
    >
      projects:
    </text>

    <text
      x="200"
      y="460"
      fill="#00ff7b"
      class="line"
      style="animation-delay:5.8s"
    >
      ACTIVE
    </text>

    <text
      x="40"
      y="520"
      fill="#00ff7b"
      class="line"
      style="animation-delay:6.4s"
    >
      $ echo "Welcome to the environment"
    </text>

    <text
      x="40"
      y="565"
      fill="#d2ffe1"
      class="line pulse"
      style="animation-delay:6.9s"
    >
      Ready for whatever comes next.
    </text>

    <rect
      x="340"
      y="548"
      width="11"
      height="21"
      fill="#00ff7b"
      class="cursor"
    />

  </g>
</svg>
