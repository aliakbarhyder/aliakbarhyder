  <style>

    .sequence {
      opacity: 0;
      animation: terminalCycle 60s infinite;
    }

    
      .sequence-0 {
        animation-delay: 0s;
      }
    
      .sequence-1 {
        animation-delay: 12s;
      }
    
      .sequence-2 {
        animation-delay: 24s;
      }
    
      .sequence-3 {
        animation-delay: 36s;
      }
    
      .sequence-4 {
        animation-delay: 48s;
      }
    

    .command {
      fill: #00d9ff;
      font-weight: 700;
    }

    .normal {
      fill: #c9d1d9;
    }

    .success {
      fill: #3fb950;
    }

    .warning {
      fill: #d29922;
    }

    @keyframes terminalCycle {

      0% {
        opacity: 0;
      }

      4% {
        opacity: 1;
      }

      72% {
        opacity: 1;
      }

      80% {
        opacity: 0;
      }

      100% {
        opacity: 0;
      }

    }

  </style>

</svg>
