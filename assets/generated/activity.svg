<svg
  xmlns="http://www.w3.org/2000/svg"
  width="100%"
  viewBox="0 0 1100 440"
  role="img"
  aria-label="GitHub activity monitor"
>
  <defs>
    <linearGradient id="activityGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff7b"/>
      <stop offset="100%" stop-color="#00c853"/>
    </linearGradient>

    <linearGradient id="activityBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="activityPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <style>
      .ring {
        transform-origin: center;
        transform: rotate(-90deg);
      }

      .commit-ring {
        stroke-dasharray: 420;
        animation: commitProgress 4s ease-in-out infinite;
      }

      .repo-ring {
        stroke-dasharray: 330;
        animation: repoProgress 5s ease-in-out infinite;
      }

      .pr-ring {
        stroke-dasharray: 250;
        animation: prProgress 6s ease-in-out infinite;
      }

      @keyframes commitProgress {
        0% { stroke-dashoffset: 420; }
        60%, 100% { stroke-dashoffset: 70; }
      }

      @keyframes repoProgress {
        0% { stroke-dashoffset: 330; }
        60%, 100% { stroke-dashoffset: 100; }
      }

      @keyframes prProgress {
        0% { stroke-dashoffset: 250; }
        60%, 100% { stroke-dashoffset: 80; }
      }

      .number {
        animation: numberPulse 2.5s ease-in-out infinite;
      }

      @keyframes numberPulse {
        0%, 100% {
          opacity: 0.75;
        }

        50% {
          opacity: 1;
        }
      }
    </style>
  </defs>

  <rect
    width="1100"
    height="440"
    rx="20"
    fill="#050906"
    stroke="#183522"
    stroke-width="2"
  />

  <text
    x="550"
    y="65"
    text-anchor="middle"
    fill="#d5ffe2"
    font-family="monospace"
    font-size="24"
    font-weight="700"
    letter-spacing="2"
  >
    GITHUB ACTIVITY MONITOR
  </text>

  <text
    x="550"
    y="95"
    text-anchor="middle"
    fill="#63806e"
    font-family="monospace"
    font-size="12"
    letter-spacing="2"
  >
    COMMITS · PULL REQUESTS · PROJECT ACTIVITY
  </text>

  <!-- COMMITS -->
  <g transform="translate(250 250)">
    <circle
      r="90"
      fill="none"
      stroke="#0d2114"
      stroke-width="16"
    />

    <circle
      r="90"
      fill="none"
      stroke="url(#activityGreen)"
      stroke-width="16"
      stroke-linecap="round"
      class="ring commit-ring"
    />

    <text
      y="-10"
      text-anchor="middle"
      fill="#00ff7b"
      font-family="monospace"
      font-size="13"
      letter-spacing="2"
    >
      COMMITS
    </text>

    <text
      y="30"
      text-anchor="middle"
      fill="#d5ffe2"
      font-family="monospace"
      font-size="30"
      font-weight="700"
      class="number"
    >
      ACTIVE
    </text>
  </g>

  <!-- PULL REQUESTS -->
  <g transform="translate(550 250)">
    <circle
      r="72"
      fill="none"
      stroke="#0d2114"
      stroke-width="16"
    />

    <circle
      r="72"
      fill="none"
      stroke="url(#activityBlue)"
      stroke-width="16"
      stroke-linecap="round"
      class="ring repo-ring"
    />

    <text
      y="-10"
      text-anchor="middle"
      fill="#00e5ff"
      font-family="monospace"
      font-size="13"
      letter-spacing="2"
    >
      PULL REQUESTS
    </text>

    <text
      y="30"
      text-anchor="middle"
      fill="#d5ffe2"
      font-family="monospace"
      font-size="30"
      font-weight="700"
      class="number"
    >
      TRACKED
    </text>
  </g>

  <!-- PROJECTS -->
  <g transform="translate(820 250)">
    <circle
      r="56"
      fill="none"
      stroke="#0d2114"
      stroke-width="16"
    />

    <circle
      r="56"
      fill="none"
      stroke="url(#activityPurple)"
      stroke-width="16"
      stroke-linecap="round"
      class="ring pr-ring"
    />

    <text
      y="-10"
      text-anchor="middle"
      fill="#c084fc"
      font-family="monospace"
      font-size="13"
      letter-spacing="2"
    >
      PROJECTS
    </text>

    <text
      y="30"
      text-anchor="middle"
      fill="#d5ffe2"
      font-family="monospace"
      font-size="22"
      font-weight="700"
      class="number"
    >
      ONLINE
    </text>
  </g>

  <line
    x1="100"
    y1="390"
    x2="1000"
    y2="390"
    stroke="#16301e"
  />

  <text
    x="550"
    y="415"
    text-anchor="middle"
    fill="#52705d"
    font-family="monospace"
    font-size="11"
    letter-spacing="2"
  >
    MONITORING PUBLIC GITHUB ACTIVITY
  </text>
</svg>
